<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creatore Carte - Bellum Penumbrum</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="app-header">
        <h1>🃏 Creatore Carte - Bellum Penumbrum</h1>
        <p>Gestisci le carte del tuo gioco su Supabase</p>
    </header>

    <main class="creator-container">
        <!-- Form Creazione Carta -->
        <section class="form-section">
            <h2>Nuova Carta</h2>
            
            <form id="card-form">
                <!-- Nome e Tipo -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="card-name">Nome Carta *</label>
                        <input type="text" id="card-name" required placeholder="Es: Angelo Custode">
                    </div>
                    
                    <div class="form-group">
                        <label for="card-type">Tipo *</label>
                        <select id="card-type" required>
                            <option value="">Seleziona...</option>
                            <option value="monster">Mostro</option>
                            <option value="mostrissimo">Mostrissimo</option>
                            <option value="sorcery">Stregoneria</option>
                            <option value="instant">Istantaneo</option>
                            <option value="field_spell">Field Spell</option>
                            <option value="aura">Aura</option>
                        </select>
                    </div>
                </div>

                <!-- Fazione e Mana -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="faction">Fazione *</label>
                        <select id="faction" required>
                            <option value="">Seleziona...</option>
                            <option value="1">Chiericanza (Bianco)</option>
                            <option value="2">Infamia (Blu)</option>
                            <option value="3">Pestilenza (Nero)</option>
                            <option value="4">Bullismo (Rosso)</option>
                            <option value="5">Grossanza (Verde)</option>
                            <option value="6">Clownerie (Giallo)</option>
                            <option value="7">Indrazzi (Incolore)</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="mana-cost">Costo Mana *</label>
                        <input type="number" id="mana-cost" min="0" max="9" value="0" required>
                    </div>
                </div>

                <!-- Stats (solo per mostri) -->
                <div class="form-row" id="stats-row">
                    <div class="form-group">
                        <label for="attack">Attack</label>
                        <input type="number" id="attack" min="0" max="20" value="0">
                    </div>
                    
                    <div class="form-group">
                        <label for="hp">HP</label>
                        <input type="number" id="hp" min="0" max="50" value="0">
                    </div>
                </div>

                <!-- Immagine -->
                <div class="form-group">
                    <label for="card-image">Immagine Carta *</label>
                    <input type="file" id="card-image" accept="image/png,image/jpeg,image/webp" required>
                    <div class="image-preview" id="image-preview">
                        <p>Anteprima immagine</p>
                    </div>
                </div>

                <!-- Effetti -->
                <div class="form-group">
                    <label>Effetti</label>
                    <div class="effects-builder">
                        <div class="effects-list" id="effects-list">
                            <!-- Effetti aggiunti dinamicamente -->
                        </div>
                        
                        <div class="effects-selector">
                            <select id="effect-type">
                                <option value="">Seleziona effetto...</option>
                                <!-- Popolato da effects.js -->
                            </select>
                            
                            <div class="effect-params" id="effect-params">
                                <!-- Parametri dinamici dell'effetto -->
                            </div>
                            
                            <button type="button" class="btn-add" id="btn-add-effect">+ Aggiungi Effetto</button>
                        </div>
                    </div>
                </div>

                <!-- Testo Effetto (descrizione) -->
                <div class="form-group">
                    <label for="effect-text">Testo Effetto (descrizione)</label>
                    <textarea id="effect-text" rows="3" placeholder="Es: Pesca 2 carte"></textarea>
                </div>

                <!-- Checkbox speciali -->
                <div class="form-row">
                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" id="is-boss">
                            Boss Card
                        </label>
                    </div>
                    
                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" id="is-indrazzi">
                            Indrazzi (Incolore)
                        </label>
                    </div>
                </div>

                <!-- Bottoni Azione -->
                <div class="form-actions">
                    <button type="submit" class="btn-primary">💾 Salva Carta</button>
                    <button type="button" class="btn-secondary" id="btn-preview">👁️ Anteprima</button>
                    <button type="reset" class="btn-secondary">🔄 Reset</button>
                </div>

                <!-- Messaggi -->
                <div id="form-message" class="form-message"></div>
            </form>
        </section>

        <!-- Anteprima Carta -->
        <section class="preview-section">
            <h2>Anteprima</h2>
            <div class="card-preview" id="card-preview">
                <div class="card card-preview-inner">
                    <div class="card-image" id="preview-image">
                        <span>Immagine</span>
                    </div>
                    <div class="card-info">
                        <div class="card-name" id="preview-name">Nome Carta</div>
                        <div class="card-type" id="preview-type">Tipo</div>
                        <div class="card-stats">
                            <span class="card-mana" id="preview-mana">⚡0</span>
                            <span class="card-atk" id="preview-atk" style="display:none;">⚔0</span>
                            <span class="card-hp" id="preview-hp" style="display:none;">❤0</span>
                        </div>
                        <div class="card-effect" id="preview-effect">
                            Testo effetto...
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lista Carte Esistenti -->
            <div class="cards-list-section">
                <h2>Carte Esistenti</h2>
                <div class="search-box">
                    <input type="text" id="search-cards" placeholder="Cerca carte...">
                    <select id="filter-faction">
                        <option value="">Tutte le fazioni</option>
                        <option value="1">Chiericanza</option>
                        <option value="2">Infamia</option>
                        <option value="3">Pestilenza</option>
                        <option value="4">Bullismo</option>
                        <option value="5">Grossanza</option>
                        <option value="6">Clownerie</option>
                        <option value="7">Indrazzi</option>
                    </select>
                </div>
                <div class="cards-grid" id="cards-grid">
                    <!-- Carte caricate da Supabase -->
                </div>
                <button class="btn-secondary" id="btn-refresh-cards">🔄 Ricarica</button>
            </div>
        </section>
    </main>

    <!-- Modale Modifica/Elimina -->
    <div id="card-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="modal-title">Carta</h3>
            <div class="modal-actions">
                <button class="btn-primary" id="modal-edit">✏️ Modifica</button>
                <button class="btn-danger" id="modal-delete">🗑️ Elimina</button>
                <button class="btn-secondary" id="modal-close">Chiudi</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
